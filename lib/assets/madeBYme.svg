<svg version="1.1" xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 400 800" width="400" height="800" 
     style="background-color: #000000;">
<defs>
    <linearGradient id="diag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0080FF"/>
        <stop offset="100%" style="stop-color:#FF0040"/>
    </linearGradient>
    
    <style>
        <![CDATA[
        .rotate-in {
            animation: rotateIn 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        @keyframes rotateIn {
            from { opacity: 0; transform: rotate(-90deg) scale(0); }
            to { opacity: 1; transform: rotate(0deg) scale(1); }
        }
        
        .draw {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 2s ease-out forwards;
        }
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
        ]]>
    </style>
</defs>

<line x1="0" y1="0" x2="400" y2="800" class="draw" stroke="url(#diag-grad)" stroke-width="2" opacity="0.3"/>

<g transform="translate(0, -50)">

    <g class="rotate-in" style="animation-delay: 0.3s; opacity: 0; transform-origin: 100px 200px;">
        <circle cx="100" cy="200" r="50" fill="none" stroke="#0080FF" stroke-width="3"/>
        <g transform="translate(100, 200) scale(1.6)">
            <path d="M-5,-10 L2,0 L8,0 L-2,12 L-5,2 L-10,2 Z" fill="#0080FF"/>
        </g>
        <text x="100" y="270" text-anchor="middle" font-family="Arial Black" font-size="14" fill="#0080FF" font-weight="bold">ELECTRICAL</text>
    </g>

    <g class="rotate-in" style="animation-delay: 0.6s; opacity: 0; transform-origin: 250px 350px;">
        <circle cx="250" cy="350" r="50" fill="none" stroke="#ffffff" stroke-width="3"/>
        <g transform="translate(250, 350) scale(1.3)">
            <path d="M-18,8 Q0,-15 18,8 H-18 M-10,8 V-5 M0,8 V-8 M10,8 V-5" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <line x1="-22" y1="8" x2="22" y2="8" stroke="#ffffff" stroke-width="2.5"/>
        </g>
        <text x="250" y="420" text-anchor="middle" font-family="Arial Black" font-size="14" fill="#ffffff" font-weight="bold">CIVIL</text>
    </g>

    <g class="rotate-in" style="animation-delay: 0.9s; opacity: 0; transform-origin: 300px 550px;">
        <circle cx="300" cy="550" r="50" fill="none" stroke="#FF0040" stroke-width="3"/>
        <g transform="translate(300, 550) scale(1.3)">
            <rect x="-14" y="-12" width="28" height="18" rx="1.5" fill="none" stroke="#FF0040" stroke-width="2.5"/>
            <line x1="-9" y1="-7" x2="0" y2="-7" stroke="#FF0040" stroke-width="1.5" opacity="0.7"/>
            <line x1="-9" y1="-3" x2="5" y2="-3" stroke="#FF0040" stroke-width="1.5" opacity="0.7"/>
            <line x1="-9" y1="1" x2="-2" y2="1" stroke="#FF0040" stroke-width="1.5" opacity="0.7"/>
            <path d="M-16,9 L16,9 L14,13 L-14,13 Z" fill="#FF0040"/>
        </g>
        <text x="300" y="620" text-anchor="middle" font-family="Arial Black" font-size="14" fill="#FF0040" font-weight="bold">COMPUTER</text>
    </g>

    <g class="rotate-in" style="animation-delay: 1.2s; opacity: 0; transform-origin: 150px 700px;">
        <text x="20" y="680" font-family="Arial Black" font-size="42" fill="#ffffff" font-weight="900">KHWOPA</text>
        <text x="20" y="710" font-family="Arial" font-size="14" fill="#888888" letter-spacing="4">COLLEGE OF</text>
        <text x="20" y="745" font-family="Arial Black" font-size="32" fill="#ffffff" font-weight="900">ENGINEERING</text>
    </g>

    <g class="rotate-in" style="animation-delay: 1.4s; opacity: 0; transform-origin: 150px 770px;">
        <text x="20" y="780" font-family="Arial" font-size="12" fill="#888888">Bhaktapur • EST. 2065 BS</text>
    </g>

    <rect x="20" y="800" width="200" height="5" rx="2" fill="#222222"/>
    <rect x="20" y="800" width="0" height="5" rx="2" fill="url(#diag-grad)">
        <animate attributeName="width" from="0" to="200" dur="2s" fill="freeze"/>
    </rect>

</g>
</svg>