name: myapp
description: KhCE App using Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  dependency_validator: ^3.0.0
  shared_preferences: ^2.3.0
  http: ^1.2.1
  dio: ^5.4.3+1
  crypto: ^3.0.3
  fluttertoast: ^8.2.4
  google_fonts: ^6.2.1
  dynamic_color: ^1.6.0
  photo_view: ^0.15.0
  flutter_native_splash: ^2.3.0
  connectivity_plus: ^6.1.4
  intl: ^0.19.0
  percent_indicator: ^4.2.3
  cached_network_image: ^3.3.1
  path_provider: ^2.1.2
  image_picker: ^1.0.2
  url_launcher: ^6.2.6 # For opening links in browser/Play Store
  font_awesome_flutter: ^10.7.0 # For social media icons
  package_info_plus: ^8.3.0 # To get app version
  flutter_local_notifications: 17.2.3
  timezone: ^0.9.4 
  carousel_slider: ^5.1.1
  shimmer: ^3.0.0
  html: ^0.15.4
  webview_flutter: ^4.7.0
  syncfusion_flutter_pdfviewer: ^30.1.38
  flutter_html: ^3.0.0-beta.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  #new
  lottie: ^3.1.3
  flutter_svg: ^2.0.10
 
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"
  change_app_package_name: ^1.4.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/icon/app_icon.png"
  # adaptive_icon_background: "#ffffff"
  # adaptive_icon_foreground: "assets/icon/foreground.png"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
    - lib/assets/calender_1.jpg
  fonts:
    - family: Nep
      fonts:
        - asset: fonts/nep.ttf   # If your font is in root/fonts/

flutter_native_splash:
  color: "#121212"  # MATCH YOUR MaterialApp surfaceColor or a suitable solid color
  image: lib/assets/bot.png # PATH TO THE SAME LOGO as in SplashScreen.dart

  # If you want manual removal to work reliably, sometimes these are needed:
  android_gravity: center
  ios_content_mode: scaleAspectFit # or center

  # Optional: Disable automatic removal if you rely purely on FlutterNativeSplash.remove()
  # You usually don't need to set these if you call .remove() correctly.
  # remove_android_splash_activity: false # Default is true
  # fullscreen: true # Ensures it covers status/navigation bars

  android_12:
    color: "#121212"
    image: lib/assets/bot.png # Or an adaptive icon version
    