name: myapp
description: KhEC App using Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  lottie: ^1.4.1
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  shared_preferences: ^2.2.3
  http: ^1.1.0
  dio: ^5.4.3+1
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  crypto: ^3.0.3
  fluttertoast: ^8.2.4
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.0
  dynamic_color: ^1.6.0
  photo_view: ^0.14.0
  flutter_native_splash: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  change_app_package_name: ^1.4.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
  fonts:
    - family: Nep
      fonts:
        - asset: fonts/nep.ttf   

flutter_native_splash:
  color: "#121212"  # MaterialApp ko surfaceColor
  image: lib/assets/bot.png 

  android_gravity: center
  ios_content_mode: scaleAspectFit # or center


  android_12:
    color: "#121212"
    image: lib/assets/bot.png # Or an adaptive icon version
    